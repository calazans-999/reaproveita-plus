<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta · Reaproveita+</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><div class="auth-wrap register-wrap"><div class="auth-art"><div class="eyebrow">CIDADÃOS NO CENTRO DA INOVAÇÃO</div><h1>Juntos, fazemos<br><em>a diferença.</em></h1><p>Crie uma conta para doar ou receber alimentos com rastreabilidade.</p><div class="auth-shape">♡</div></div><div class="auth-panel"><a class="brand" th:href="@{/login}"><span class="logo">♻</span>Reaproveita<span class="brand-plus">+</span></a><h2>Criar conta</h2><div class="alert bad" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><label>Seu nome<input name="name" required minlength="2" maxlength="120" placeholder="Nome completo"></label><label>E-mail<input name="email" type="email" required maxlength="180"></label><label>Senha (mínimo de 8 caracteres)<input name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></label><label>Perfil<select name="role" required><option value="DONOR">Doador</option><option value="RECEIVER">Organização receptora</option></select></label><button class="btn" type="submit">Criar minha conta</button></form><p class="auth-alt">Já possui conta? <a th:href="@{/login}">Entrar</a></p></div></div></body></html>
