# Inicia APENAS a API; mantem o PostgreSQL original na porta 5434 do Windows.
# Docker Desktop para Windows disponibiliza host.docker.internal para acesso ao host.
services:
  app:
    image: reaproveita-plus:etapa10
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://host.docker.internal:5434/reaproveita"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:?Defina DB_USER no .env.etapa10}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no .env.etapa10}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-default}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
